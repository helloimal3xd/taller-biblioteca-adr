<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca — Sistema de préstamos</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: #f7f5f0;
    color: #2b2b2b;
  }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.1rem; margin-top: 0; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    margin-top: 1.5rem;
  }
  section {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 1rem;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .5rem 0;
    border-bottom: 1px solid #eee;
    gap: .5rem;
  }
  .badge {
    font-size: .8rem;
    background: #eee;
    padding: .2rem .5rem;
    border-radius: 4px;
    white-space: nowrap;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: .5rem;
    margin-top: 1rem;
  }
  input, select, button {
    padding: .5rem;
    font-size: 1rem;
    border-radius: 4px;
    border: 1px solid #ccc;
  }
  button {
    cursor: pointer;
    background: #2b6cb0;
    color: white;
    border: none;
  }
  button:hover { background: #245a94; }
  .btn-devolver {
    background: #38761d;
    padding: .2rem .6rem;
    font-size: .85rem;
  }
  .mensaje {
    margin-top: 1rem;
    padding: .5rem;
    border-radius: 4px;
    min-height: 1.5rem;
  }
  .mensaje.exito { background: #d4edda; color: #155724; }
  .mensaje.error { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>
  <h1>📚 Biblioteca — Sistema de préstamos</h1>
  <p id="mensaje" class="mensaje"></p>

  <div class="grid">
    <section>
      <h2>Catálogo</h2>
      <ul id="lista-libros"></ul>
      <form id="form-libro">
        <input id="input-titulo" placeholder="Título" required>
        <input id="input-autor" placeholder="Autor" required>
        <input id="input-copias" type="number" min="1" placeholder="Copias" required>
        <button type="submit">Agregar libro</button>
      </form>
    </section>

    <section>
      <h2>Préstamos</h2>
      <ul id="lista-prestamos"></ul>
      <form id="form-prestamo">
        <select id="select-libro"></select>
        <input id="input-socio" placeholder="Nombre del socio" required>
        <button type="submit">Registrar préstamo</button>
      </form>
    </section>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
